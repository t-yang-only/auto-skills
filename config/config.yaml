version: 3.0.0
is_configured: true
auto_update:
  auto_download_public_update: true
  check_interval_hours: 24
  remote_git_url: https://github.com/t-yang-only/auto-skills.git
notifications:
  enabled: null
  serverchan_sendkey: ''
  wecom_webhook: ''
  feishu_webhook: ''
  dingtalk_webhook: ''
  dingtalk_secret: ''
  pushplus_token: ''
  telegram_bot_token: ''
  telegram_chat_id: ''
  bark_url: ''
nm_skills:
  always_enable_project_ledger: true
  default_client_id: CODE
  default_lease_minutes: 45
  auto_claim_before_edit: true
  auto_check_file_conflicts: true
  auto_clean_stale_locks: true
  ledger_dir_name: agent_word
persona:
  talk_like_girlfriend:
    default_enabled: false
    kb_sync_traits: true
    kb_source_url_or_path: D:/ObsidianVault
    kb_api_token: ''
    traits_cache_file: .evolution/profile/persona_girlfriend.json
evolution_vault:
  private_git_remote: 
  auto_sync_on_install: true
  custom_skills_dir: .evolution/custom_skills
agent_connections:
  auto_scan_on_startup: true
  connected_agents:
  - Codex CLI / Extension
  - Claude Code / ~/.agents
  - DeepSeek Harness (DSH)
  - WorkBuddy AI
  - Claude Code Dedicated
  - Cursor IDE
# ==============================================================================
# 数据库落库（完整说明见 随仓库分发的接入指南）
# 一句话：落库是「旁路」——写得进去就写，写不进去只记日志，绝不影响主流程。
# ==============================================================================
database:
  # ── 总开关 ────────────────────────────────────────────────────────────────
  # false = 完全不落库：不连库、不建表、不写任何表、不做超期清理。
  # 想彻底关掉这个功能，只改这一行就够了。
  enabled: true

  # ── 连接方式（三选一）──────────────────────────────────────────────────────
  #   mysql     远端 MySQL（8.x / 5.7 均可），用下面的 host/port/user/dbname
  #   sqlite    本地文件库，零依赖零配置，落在 .evolution/auto_skills.db
  #   disabled  等价于 enabled: false（保留 type 字段是为了让配置表意清楚）
  type: mysql

  # mysql 直连参数（type: mysql 时生效）
  host: db.example.com
  port: 42870
  dbname: auto_skills
  user: auto_agent

  # ── 凭据来源（三选一，按下面列出的顺序解析，命中即用）──────────────────────
  #   1) password_env   环境变量名（适合 CI / 容器 / 临时覆盖）
  #   2) password_file  文件路径，相对本技能根目录；文件内容即密码 —— 推荐
  #   3) password       直接把密码写在这里 —— 不推荐，本文件是 git 仓库会被推送
  #
  # 三者都空则报错停止（不会静默用某个内置账号连上）。
  password_file: config/db.password
  password_env: ''
  password: ''

  # sqlite 路径（type: sqlite 时生效；留空用默认 .evolution/auto_skills.db）
  sqlite_path: ''

  # ── 分项开关：可单独关掉某一类落库，其余照常写 ─────────────────────────────
  # 未列出的项按「开启」处理，所以旧配置不改也完全保持原行为。
  streams:
    task_claim: true           # -> nm_tasks               多 Agent 认领 / 租约锁
    task_done: true            # -> nm_work_logs           任务完成登记与改动清单
    tool_trace: true           # -> tool_execution_traces  工具调用轨迹
    router_audit: true         # -> router_audit_logs      路由判定审计
    skill_registry: true       # -> skill_registry         技能台账
    academic_references: true  # -> academic_references    参考文献

  # ── 保留策略 ──────────────────────────────────────────────────────────────
  retention_days: 30
  auto_cleanup_expired_traces: true

  # ------------------------------------------------------------------
  # 数据库不可用时的自动预案：熔断 + 本地暂存 + 自动补传
  # 落库是【旁路】——数据库挂了既不能丢数据，也不能拖慢 agent。
  # 实现在 scripts/db_sync.py 的「容错层」；自检用 python db_sync.py --doctor
  # ------------------------------------------------------------------
  failover:
    # 总开关。false = 退回「失败只记日志」的老行为（不熔断、不暂存、不补传）
    enabled: true
    # 连续失败多少次后熔断。熔断期间不再发起连接——否则每次落库都要干等
    # 连接超时（实测 8 秒/次），数据库挂了会把 agent 拖垮。
    breaker_threshold: 3
    # 熔断冷却秒数。到点后放行一次试探，成功即恢复并自动补传。
    breaker_cooldown_seconds: 120
    # 失败时把「函数名 + 参数」暂存到 .evolution/db_spool/pending.jsonl，库恢复后自动回灌
    spool_enabled: true
    # 暂存上限（条）。超出后丢弃新记录并写日志，保护磁盘
    spool_max_records: 2000
    # 超过这么多天的暂存移入 dead.jsonl（不再补传，但人工可查）
    spool_max_age_days: 7
    # 单次最多补传多少条 / 补传节流间隔（秒）
    replay_batch: 50
    replay_interval_seconds: 60
    # 单条记录补传尝试上限，超出移入 dead.jsonl
    max_attempts: 5
    # 熔断打开时推送告警（复用 notifications.serverchan_sendkey；留空则不推）
    notify_on_breaker: false

agent_gateway:
  # Agent 网关（意见请求 / 知识库只读 / 事件上报）
  enabled: true
  url: https://your-gateway.example.com
  # 令牌从文件读，绝不写进本文件（本 skill 是 git 仓库，会被推送）
  token_file: config/gateway.token
  timeout_seconds: 30
  # 提问时的默认紧急度：normal / high
  default_urgency: normal